name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci, not npm install: it installs exactly what package-lock.json pins and
      # fails if the lockfile and the manifests disagree. A judged build should not
      # depend on what the registry happened to resolve that morning.
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Typecheck frontend
        run: npm run typecheck --workspace frontend
      - name: Build frontend
        run: npm run build
