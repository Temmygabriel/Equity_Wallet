# Publishes the contract sources to the Robinhood Chain testnet explorer.
#
# Manual dispatch only. Build Spec §6 asks for contracts verified on the explorer,
# and the deployment record showed them as is_verified: false until this runs.
#
# No secrets are needed. Verification is a read of local sources plus an API
# submission — it sends no transaction and spends no ETH, so there is no private
# key in this job at all.
#
# GrantEscrow is the contract that matters for the submission; the mocks are
# verified too so a judge can read every address in the deployment record rather
# than taking the demo on trust.

name: Verify contracts on the explorer

on:
  workflow_dispatch:
    inputs:
      grant_escrow_address:
        description: GrantEscrow address
        required: true
        default: "0x339a44f967dD1eD1bDBa98Fb4396DaB77e4D3645"
      usdg_address:
        description: MockUSDG address (constructor arg 1)
        required: true
        default: "0x308b3d480199ACcD21c8BE882A5E9F3077D0EaAC"
      swap_adapter_address:
        description: MockSwapAdapter address (constructor arg 2)
        required: true
        default: "0x9B097E89cDe2f9DBa4001594C25692b5a5e5a529"
      aapl_address:
        description: Mock AAPL address (constructor arg 3)
        required: true
        default: "0x17078672b60471957f42A0343d510B1a4e81DC59"
      tsla_address:
        description: Mock TSLA address (constructor arg 4)
        required: true
        default: "0x6993Ef68e09ec698bb8A607Eb24a28060906b27E"
      nvda_address:
        description: Mock NVDA address (constructor arg 5)
        required: true
        default: "0x31bACde94bEa0FE3035227053dbf03a4B029a6fC"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RH_RPC_URL: https://rpc.testnet.chain.robinhood.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npm run compile

      # Three things here are load-bearing and each was got wrong once:
      #
      #   working-directory — `npx hardhat` resolves the project from the current
      #     directory, and at the repo root there is no hardhat.config.ts, so it
      #     aborts with HH1 and verifies nothing.
      #
      #   set -o pipefail — without it a step's exit status is tee's, which is
      #     always 0, so a failed verification reports as a green job. That is
      #     exactly how the first run of this workflow "passed" doing nothing.
      #
      #   tolerating "Already verified" — re-running this workflow is a normal
      #     thing to do, and the explorer rejecting a duplicate is not a failure.
      - name: Verify the contracts
        working-directory: contracts
        env:
          GRANT_ESCROW: ${{ inputs.grant_escrow_address }}
          USDG: ${{ inputs.usdg_address }}
          SWAP_ADAPTER: ${{ inputs.swap_adapter_address }}
          AAPL: ${{ inputs.aapl_address }}
          TSLA: ${{ inputs.tsla_address }}
          NVDA: ${{ inputs.nvda_address }}
        run: |
          set -o pipefail
          : > verify.log

          verify() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a verify.log
            if npx hardhat verify --network robinhoodTestnet "$@" 2>&1 | tee -a verify.log; then
              return 0
            fi
            if tail -n 5 verify.log | grep -q "Already verified"; then
              echo "($label was already verified; nothing to do)" | tee -a verify.log
              return 0
            fi
            return 1
          }

          status=0

          # Constructor arguments must be in declaration order or the explorer
          # rejects the match. GrantEscrow is (usdg, swapAdapter, aapl, tsla, nvda).
          verify "GrantEscrow" "$GRANT_ESCROW" \
            "$USDG" "$SWAP_ADAPTER" "$AAPL" "$TSLA" "$NVDA" \
            --contract contracts/GrantEscrow.sol:GrantEscrow || status=1

          verify "MockUSDG" "$USDG" \
            --contract contracts/mocks/MockUSDG.sol:MockUSDG || status=1

          verify "MockSwapAdapter" "$SWAP_ADAPTER" \
            --contract contracts/mocks/MockSwapAdapter.sol:MockSwapAdapter || status=1

          # MockStockToken is (name, symbol, multiplier); the deploy script uses
          # a multiplier of 1e6 for all three so the UI can show whole shares.
          verify "Mock AAPL" "$AAPL" "Test Apple Stock" "AAPL" 1000000 \
            --contract contracts/mocks/MockStockToken.sol:MockStockToken || status=1

          verify "Mock TSLA" "$TSLA" "Test Tesla Stock" "TSLA" 1000000 \
            --contract contracts/mocks/MockStockToken.sol:MockStockToken || status=1

          verify "Mock NVDA" "$NVDA" "Test Nvidia Stock" "NVDA" 1000000 \
            --contract contracts/mocks/MockStockToken.sol:MockStockToken || status=1

          exit $status

      - name: Publish the result
        if: always()
        run: |
          {
            echo "## Explorer verification"
            echo
            if [ -s contracts/verify.log ]; then
              echo '```'
              cat contracts/verify.log
              echo '```'
            else
              echo "No output was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
